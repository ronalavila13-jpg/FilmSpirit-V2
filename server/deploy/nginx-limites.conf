# FilmSpirit · límites por IP antes de llegar a la app
# deploy/nginx-limites.sh lo copia a /etc/nginx/conf.d/filmspirit-limites.conf (lo usan instalar.sh y actualizar.sh).
#   · /api/: 30 solicitudes por segundo por IP, con margen de 300 de golpe (abrir un proyecto pide varias cosas a la vez)
#   · entrar con Google (/api/auth/): 10 por minuto por IP, con margen de 20
#   · conexiones abiertas a la vez: hasta 120 por IP (los cambios en vivo de cada pestaña cuentan una y no tienen tope
#     de solicitudes: se reconectan solos)
# Una oficina entera detrás de una misma IP entra holgada. Lo que pasa el límite recibe 429 («Demasiadas solicitudes»),
# igual que los límites de la propia app, que siguen por persona.
map $request_uri $fs_lim_api {
  ~^/api/p/[^/]+/events  "";
  ~^/api/                $binary_remote_addr;
  default                "";
}
map $request_uri $fs_lim_auth {
  ~^/api/auth/  $binary_remote_addr;
  default       "";
}
limit_req_zone  $fs_lim_api  zone=fs_api:10m  rate=30r/s;
limit_req_zone  $fs_lim_auth zone=fs_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=fs_conn:10m;
limit_req  zone=fs_api  burst=300 nodelay;
limit_req  zone=fs_auth burst=20  nodelay;
limit_conn fs_conn 120;
limit_req_status  429;
limit_conn_status 429;
