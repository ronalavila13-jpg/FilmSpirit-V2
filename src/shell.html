}

/* los encabezados de escena, tal cual en el guion: en Courier y en mayúsculas, enteros (pasan a otra línea, sin «…»),
   y debajo una línea que cuenta la escena (la sinopsis o el comienzo de la primera acción) */
.sch,#view .sch{font-family:var(--font-script);text-transform:uppercase;font-weight:700;letter-spacing:0;overflow-wrap:anywhere}
/* fuera del Guion y del Guion rayado, los encabezados de escena y sus descripciones van en la letra del programa (la que
   se elige en Apariencia › Letra), en mayúsculas como en el guion. Las citas del guion (el texto de la acción) siguen en
   Courier */
:root:not([data-tab="script"]):not([data-tab="lined"]) :is(.sch,#view .sch){font-family:var(--font-ui);font-weight:650;letter-spacing:.01em}
:root:not([data-tab="script"]):not([data-tab="lined"]) :is([data-bind="synopsis"],.b-syn,.panel .pd,.shv-tx p,.c-hd small){font-family:var(--font-ui)}
.scd{display:block;margin-top:2px;font-family:var(--font-ui,inherit);font-size:var(--fs-2);font-weight:400;font-style:normal;letter-spacing:0;text-transform:none;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .h.sh-h{display:block;-webkit-line-clamp:unset;line-clamp:unset;overflow:hidden;min-width:0}
.slist .h.sh-h .sch{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:var(--fs-2);line-height:1.35;overflow-wrap:normal;word-break:normal}
.sb-scene>header :is(h2,h3){min-width:0}
.sb-scene>header :is(h2,h3) .scd{margin-top:3px}
.supsc>header :is(h2,h3).sch{line-height:1.3;text-wrap:balance}
.supsc>header .scd{margin:3px 0 0;max-width:100%}
.prow .c-hd b.sch{font-weight:700}
.cl .cl-sc .cl-sd{margin-top:3px}
@media (max-width:760px){
  .prow.sc>.c-hd b.sch{display:block;white-space:normal}
  .prow.sc>.c-hd b.sch>.hm{overflow:visible;text-overflow:clip}
  .prow.sc>.c-hd b.sch>.ht,.prow.sc>.c-hd b.sch>em{white-space:normal}
}

/* fechas: el campo se escribe a mano («19/10/2026», «19 oct», «lunes 19») y el calendario es un mes grande */
.fecha{display:inline-flex;align-items:stretch;min-width:0}
.fecha-in{width:17ch;min-width:0;border-top-right-radius:0 !important;border-bottom-right-radius:0 !important}
.fecha-in.bad{border-color:var(--danger,#C62828) !important;box-shadow:0 0 0 2px color-mix(in oklab,var(--danger,#C62828) 22%,transparent)}
.fecha-cal{display:grid;place-items:center;width:34px;padding:0;border:var(--l1) solid var(--line);border-left:0;border-radius:0 var(--r-sm,4px) var(--r-sm,4px) 0;background:var(--fill);color:var(--ink);cursor:pointer}
.fecha-cal:hover{background:color-mix(in oklab,var(--ink) 9%,var(--fill))}
.fecha-cal:disabled{opacity:.5;cursor:default}
.fecha-cal svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fecha-solo{display:flex;margin-bottom:10px}.fecha-solo .fecha-in{width:100%;border-radius:var(--r-sm,4px) !important}.fecha-solo .fecha-cal{display:none}
.pop.pop-fcal{padding:14px 14px 12px}
.fcal{width:316px;max-width:100%}
.fcal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fcal-m{font-size:var(--fs-4);font-weight:700}
.fcal-nav{width:36px;height:36px;border:0;border-radius:var(--r-sm,4px);background:none;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.fcal-nav:hover{background:var(--fill)}
.fcal-wd,.fcal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.fcal-wd span{text-align:center;font-size:var(--fs-1);font-weight:700;color:var(--muted);padding:2px 0 4px}
.fcal-d{position:relative;height:40px;border:0;border-radius:var(--r-sm,4px);background:none;color:var(--ink);font:inherit;font-size:var(--fs-3);font-variant-numeric:tabular-nums;cursor:pointer}
.fcal-d:hover{background:var(--fill)}
.fcal-d.out{color:color-mix(in oklab,var(--muted) 60%,transparent)}
.fcal-d.hoy{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--ink) 45%,transparent)}
.fcal-d.mk::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--tab-deep,var(--accent))}
.fcal-d.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.fcal-d.sel::after{background:var(--accent-ink)}
.fcal-d:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fcal-q{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:var(--l1) solid var(--line)}
.fcal-q .chip{cursor:pointer;font:inherit;font-size:var(--fs-2)}
.fcal-leg{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:var(--fs-1);color:var(--muted)}
.fcal-leg i{width:6px;height:6px;border-radius:50%;background:var(--tab-deep,var(--accent))}
@media (max-width:760px){ .fcal{width:100%} .fcal-d{height:44px} }

/* ============================================================
   Mejoras de interfaz (auditoría con Taste Skill, 21 oct 2026)
   Va al final de los estilos de src/shell.html. Conserva la identidad:
   íconos ilustrados de las etapas, colores pastel de cada pestaña,
   naranja de la marca solo en la acción principal.
   ============================================================ */

/* 1 · riel de etapas: cada ícono con su nombre debajo; la elegida en tinta */
@media (min-width:761px){
  #tabs.tabs{gap:6px;padding-top:14px}
  /* también al pasar el mouse y con su menú abierto: si cambiara de alto, las etapas de abajo se correrían y el puntero
     saltaría de una a otra sin parar */
  #tabs .stg-h,#tabs .stg-h:hover,#tabs .stg.open .stg-h{flex-direction:column;gap:5px;width:76px;height:auto;padding:9px 0 8px}
  #tabs .stg-h svg.lf{width:32px;height:32px}
  #tabs .stg.on .stg-h svg.lf{transform:none}
  #tabs .stg-h .stg-n{display:block;font-size:11.5px;font-weight:550;line-height:1.1;color:var(--muted);letter-spacing:0}
  #tabs .stg.on .stg-h .stg-n{color:var(--ink);font-weight:700}
  #tabs .stg-h:hover .stg-n{color:var(--ink)}
  #tabs .stg.on .stg-h{background:var(--fill)}
  #tabs .stg.on .stg-h::after{right:-6px;top:12px;bottom:12px;width:3px}
  #tabs .stg.on.stg-just .stg-h svg.lf{animation:none}
  #tabs .stg.on:not(.stg-just) .stg-h:hover svg.lf{animation:stg-hop .55s ease-out}
}

/* 2 · subpestañas: un solo gesto en todas, subrayado de 2 px sobre la línea de la barra; sin relleno de color */
.bar :is(.seg button,.btn)[aria-pressed="true"]{border-radius:0 !important;background:transparent !important;color:var(--ink) !important;font-weight:650;box-shadow:inset 0 -2px 0 var(--tab-deep,var(--ink)) !important}
:root[data-theme="dark"] .bar :is(.seg button,.btn)[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--ink) !important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar :is(.seg button,.btn)[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--ink) !important}}
.bar .seg button:not([aria-pressed="true"]):hover{background:var(--fill) !important;color:var(--ink)}

/* 3 · ningún texto bajo 11 px */
.cv .cvl{font-size:max(.7em,11px)}
.nb{font-size:11px}

/* 4 · barra superior: el naranja solo en «Nuevo»; Proyectos como botón de texto */
#openBtn{background:transparent;border-color:transparent}
#openBtn:hover{background:var(--fill)}

/* 5 · avisos de ayuda: una fila gris discreta con el ícono de información y su ✕ (lote I: como en las cabeceras) */
.tip{border:0;background:var(--fill);border-radius:12px;padding:8px 8px 8px 10px;gap:10px;color:var(--muted);font-size:13px;align-items:center}
svg.tip-i{width:16px;height:16px;flex:none;background:none;color:var(--muted);margin:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tip-x{opacity:.7}

/* 6 · estados vacíos: muestran lo que vendrá */
/* la imagen de Inicio vive en el servidor (/portada/): en la página suelta y en el escritorio no hay, y no queda un
   recuadro vacío */
.home-empty{column-gap:40px;align-items:center;padding:36px}
:root[data-srv] .home-empty{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.home-empty>*{grid-column:1}
.home-empty h2{font-size:var(--fs-7);letter-spacing:-.01em}
:root[data-srv] .home-empty::after{content:"";grid-column:2;grid-row:1/span 6;align-self:stretch;justify-self:stretch;min-height:280px;border:var(--l1) solid var(--line);border-radius:var(--r);background:var(--fill) url(/portada/f-guion-claro.webp) left top/cover no-repeat}
:root[data-srv][data-theme="dark"] .home-empty::after{background-image:url(/portada/f-guion-oscuro.webp)}
@media (prefers-color-scheme: dark){:root[data-srv]:not([data-theme="light"]) .home-empty::after{background-image:url(/portada/f-guion-oscuro.webp)}}
@media (max-width:760px){:root .home-empty{grid-template-columns:1fr;padding:24px}.home-empty::after{grid-column:1;grid-row:auto;min-height:180px;margin-top:8px}}

/* 7 · calendario: el mes en tinta; su color queda en una línea fina, el color vivo para las tareas */
.cm-h{background:transparent;color:var(--ink);border-top:3px solid var(--c);border-bottom:var(--l1) solid var(--line)}
.cm-wds span{background:color-mix(in oklab,var(--c) 22%,var(--surface));color:var(--muted)}

/* 8 · guion en el teléfono: página más angosta y letra un 23 % más grande, con el mismo formato */
@media (max-width:560px){
  .pages:not(.av-pages){--fs:calc((100vw - 24px) / 39.5) !important}
  .pages:not(.av-pages) .page{width:39.5em}
  .pages:not(.av-pages) .page .lines{padding-left:2.5em}
  .pages:not(.av-pages) .page .scn{left:0 !important;right:auto !important;width:2em}
  .pages:not(.av-pages) .page .pgno{right:1.5em}
}

/* 9 · etiquetas en tipo oración, no en mayúsculas */
.cs-fold{text-transform:none;letter-spacing:0;font-size:var(--fs-2);font-weight:650;color:var(--muted)}
/* ============ revisión de diseño (octubre 2026): íconos, blancos de toque y foco ============
   Íconos de línea (ICO en barra.js: rejilla de 24 y trazo de 1,8) en tres tamaños: 16 px en menús y textos, 18 px en
   las barras y 20 px los destacados. Todo botón de solo ícono mide al menos 24 × 24 px con el mouse; con el dedo, el
   área de toque crece por fuera (::after) hasta unos 44 px sin mover nada de la vista. */

   les quitaba el contorno) y en los campos que solo cambiaban de fondo */
input:is([type=checkbox],[type=radio],[type=color],[type=range]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label:has(>.file-in){position:relative}

#brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ============ color del oficio (octubre de 2026, tercera entrega) ============
   Una sola maqueta para claro y oscuro; el color queda para lo que significa algo en un rodaje. En la apariencia
   clara, las tiras del plan y las cabeceras de escena de la hoja de script van en su color entero de día o de noche,
   como un stripboard; en la oscura, con el velo de siempre (no deslumbran de noche). */
:root[data-tone="light"] :is(.prow.sc,.prow.ev.hl)::before{display:none}
:root[data-tone="light"] :is(.prow.sc,.prow.ev.hl){background:var(--rc)}
:root[data-tone="light"] .prow.sc[data-dn="d"]{background:var(--strip-d)}
:root[data-tone="light"] .prow.sc[data-dn="n"]{background:var(--strip-n)}
:root[data-tone="light"] .prow.sc{border-top-color:color-mix(in oklab,var(--ink) 28%,transparent)}
:root[data-tone="light"] .supsc[data-dn="d"]>header{background:var(--strip-d);border-bottom:0}
:root[data-tone="light"] .supsc[data-dn="n"]>header{background:var(--strip-n);border-bottom:0}
/* sobre el color entero, los textos secundarios salen de la tinta (no de un gris que se pierde) */
/* (los textos secundarios toman un poco del color de la tira: no quedan grises sobre el color, y se leen a 4,5:1 o más) */
:root[data-tone="light"] :is(.prow.sc,.prow.ev.hl,.supsc[data-dn]>header){--muted:color-mix(in oklab,var(--ink) 84%,var(--rc,var(--strip-d)));--faint:color-mix(in oklab,var(--ink) 74%,var(--rc,var(--strip-d)));--ph:color-mix(in oklab,var(--ink) 78%,var(--rc,var(--strip-d)))}
:root[data-tone="light"] :is(.prow.sc[data-dn="d"],.supsc[data-dn="d"]>header){--muted:color-mix(in oklab,var(--ink) 84%,var(--strip-d));--faint:color-mix(in oklab,var(--ink) 74%,var(--strip-d));--ph:color-mix(in oklab,var(--ink) 78%,var(--strip-d))}
:root[data-tone="light"] :is(.prow.sc[data-dn="n"],.supsc[data-dn="n"]>header){--muted:color-mix(in oklab,var(--ink) 84%,var(--strip-n));--faint:color-mix(in oklab,var(--ink) 74%,var(--strip-n));--ph:color-mix(in oklab,var(--ink) 78%,var(--strip-n))}
/* sobre un color oscuro de la leyenda, la letra clara */
:root[data-tone="light"] :is(.prow.dk,.supsc.dk>header){--ink:#F4F4F4;--muted:#E2E2E2;color:#F4F4F4}
:root[data-tone="light"] .prow.dk :is(input,select,textarea){color:#F4F4F4}

/* ============ el teléfono en el set (octubre de 2026, tercera entrega) ============ */
/* hoja de script: la cabecera de la jornada se pliega en una línea (tarjeta · sonido · llamado) y se abre al tocarla */
.sup-hd{display:grid;gap:10px}
.sup-hs{display:none}
.sup-dock{display:none}
@media (max-width:760px){
  .sup-hs{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%;min-height:44px;align-items:center;border:0;background:var(--fill);border-radius:var(--r-sm);padding:8px 12px;font:inherit;font-size:var(--fs-3);color:var(--muted);text-align:left}
  .sup-hs b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  [data-mfold].sup-hd>.mf-h.sup-hs{display:flex}
  /* «+ Toma» del plano en rodaje, fijo abajo y al alcance del pulgar */
  .sup-dock{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--chrome);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(0,0,0,.08)}
  .sup-dk-go{flex:1;min-width:0;min-height:48px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;justify-items:start;border:0;background:none;padding:2px 4px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
  .sup-dk-go small{grid-column:1/-1;font-size:var(--fs-1);font-weight:650;color:var(--muted)}
  .sup-dk-go b{font-size:var(--fs-5);font-variant-numeric:tabular-nums}
  .sup-dk-go span{font-size:var(--fs-2);color:var(--muted)}
  .sup-dk-add{min-height:48px;padding-inline:18px;font-size:var(--fs-5);gap:6px}
  /* la última toma: un toque para marcarla NG, OK o Buena (y su tarjeta y nota) */
  .sup-dock .sup-dk-tk{min-height:48px;min-width:48px;padding:0 12px;flex:none;border-radius:var(--r-sm);font:inherit;font-size:var(--fs-3);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
  .sup-dk-add .ic{width:18px;height:18px}
  #view:has(.sup-dock) .scroller{padding-bottom:88px}
  body:has(.sup-dock) .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* con el dedo: tomas, «+ Toma», el ⋯ del plano y la casilla de rodado, de 44 px */
@media (pointer:coarse),(max-width:760px){
  .suprow .takes .take,.suprow .takes .btn.sm{min-height:44px;min-width:44px;padding-inline:12px}

}
/* «Sin conexión» con palabras en el teléfono (arriba solo había un punto en el menú) */
.off-banner{display:none}
@media (max-width:760px){
  .off-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--warn-soft);color:var(--ink);font-size:var(--fs-3);font-weight:600}

}

}

:root[data-tone="dark"] :is([data-tabgo="animatic"],.stg-m .tab[data-tab="animatic"]){--ti-sol:#544C44;--ti-sol-ink:#FFFEF6;--ti-pt:#292624;--ti-pt-c:#98948E}

:root[data-tone="dark"][data-tab="plan"]{--sx-sol:#FFBE0B;--sx-sol-ink:#222222;--sx-tab:#FFBE0B;--sx-tab-ink:#222222;--sx-pt:#372E14;--sx-pt-deep:#FFBE0B;--sx-pt-mid:#5C4813;--sx-pt-c:#FFBE0B;--sx-pt-bar:#322A15}
:root[data-tone="dark"] :is([data-tabgo="plan"],.stg-m .tab[data-tab="plan"]){--ti-sol:#FFBE0B;--ti-sol-ink:#222222;--ti-pt:#5C4813;--ti-pt-c:#FFBE0B}
:root[data-tone="dark"][data-tab="cal"]{--sx-sol:#FFBE0B;--sx-sol-ink:#222222;--sx-tab:#F5AA00;--sx-tab-ink:#222222;--sx-pt:#372E14;--sx-pt-deep:#FFBE0B;--sx-pt-mid:#59420F;--sx-pt-c:#F5AA00;--sx-pt-bar:#312813}
:root[data-tone="dark"] :is([data-tabgo="cal"],.stg-m .tab[data-tab="cal"]){--ti-sol:#F5AA00;--ti-sol-ink:#222222;--ti-pt:#59420F;--ti-pt-c:#F5AA00}
:root[data-tone="dark"][data-tab="budget"]{--sx-sol:#FFBE0B;--sx-sol-ink:#222222;--sx-tab:#E0A500;--sx-tab-ink:#222222;--sx-pt:#372E14;--sx-pt-deep:#FFBE0B;--sx-pt-mid:#53410F;--sx-pt-c:#E2AB12;--sx-pt-bar:#2E2713}
:root[data-tone="dark"] :is([data-tabgo="budget"],.stg-m .tab[data-tab="budget"]){--ti-sol:#E0A500;--ti-sol-ink:#222222;--ti-pt:#53410F;--ti-pt-c:#E2AB12}
:root[data-tone="dark"] #tabs .stg[data-g="4"]{--sg-sol:#E8730C;--sg-sol-ink:#222222;--sg-pt:#332315;--sg-pt-c:#E8730C}
:root[data-tone="dark"][data-tab="call"]{--sx-sol:#E8730C;--sx-sol-ink:#222222;--sx-tab:#F07F14;--sx-tab-ink:#222222;--sx-pt:#332315;--sx-pt-deep:#EC8E3C;--sx-pt-mid:#573615;--sx-pt-c:#F29033;--sx-pt-bar:#302316}
:root[data-tone="dark"] :is([data-tabgo="call"],.stg-m .tab[data-tab="call"]){--ti-sol:#F07F14;--ti-sol-ink:#222222;--ti-pt:#573615;--ti-pt-c:#F29033}
:root[data-tone="dark"][data-tab="sup"]{--sx-sol:#E8730C;--sx-sol-ink:#222222;--sx-tab:#A94F08;--sx-tab-ink:#FFFEF6;--sx-pt:#332315;--sx-pt-deep:#EC8E3C;--sx-pt-mid:#422712;--sx-pt-c:#C78D5F;--sx-pt-bar:#281D14}
:root[data-tone="dark"] :is([data-tabgo="sup"],.stg-m .tab[data-tab="sup"]){--ti-sol:#A94F08;--ti-sol-ink:#FFFEF6;--ti-pt:#422712;--ti-pt-c:#C78D5F}
:root[data-tone="dark"][data-tab="project"]{--sx-sol:#4A4F57;--sx-sol-ink:#FFFFFF;--sx-tab:#4A4F57;--sx-tab-ink:#FFFFFF;--sx-pt:#262626;--sx-pt-deep:#C8C8C8;--sx-pt-mid:#353535;--sx-pt-c:#A8A8A8;--sx-pt-bar:#262626}

   íconos de las etapas también en gris. Los colores del oficio (tiras, categorías, avisos) y el logotipo no cambian */
:root[data-secn] #tabs .stg[data-g]{--sg-sol:#2A2A2A;--sg-sol-ink:#FFFFFF;--sg-pt:#EFEFEF;--sg-pt-c:#5A5A5A}
:root[data-secn][data-tab]{--sx-sol:#2A2A2A;--sx-sol-ink:#FFFFFF;--sx-tab:#4A4A4A;--sx-tab-ink:#FFFFFF;--sx-pt:#F4F4F4;--sx-pt-deep:#2A2A2A;--sx-pt-mid:#E8E8E8;--sx-pt-c:#6A6A6A;--sx-pt-bar:#F5F5F5}
:root[data-secn] :is([data-tabgo],.stg-m .tab[data-tab]){--ti-sol:#4A4A4A;--ti-sol-ink:#FFFFFF;--ti-pt:#E8E8E8;--ti-pt-c:#6A6A6A}
:root[data-secn][data-tone="dark"] #tabs .stg[data-g]{--sg-sol:#3D3D3D;--sg-sol-ink:#FFFFFF;--sg-pt:#262626;--sg-pt-c:#B0B0B0}
:root[data-secn][data-tone="dark"][data-tab]{--sx-sol:#3D3D3D;--sx-sol-ink:#FFFFFF;--sx-tab:#555555;--sx-tab-ink:#FFFFFF;--sx-pt:#242424;--sx-pt-deep:#C8C8C8;--sx-pt-mid:#353535;--sx-pt-c:#A8A8A8;--sx-pt-bar:#262626}
:root[data-secn][data-tone="dark"] :is([data-tabgo],.stg-m .tab[data-tab]){--ti-sol:#555555;--ti-sol-ink:#FFFFFF;--ti-pt:#353535;--ti-pt-c:#A8A8A8}
:root[data-secn] :is(#tabs .stg .stg-h svg.lf,.tabstrip .ts-ic svg.lf){filter:grayscale(1) !important}
/* la etapa elegida en la barra de la izquierda: Sólidos, una baldosa de su color con el nombre y el ícono en su tinta;
   Pastel, su velo y una raya de su color. (!important: le gana a las reglas viejas del modo oscuro) */
@media (min-width:761px){
  #tabs .stg:not(.on) .stg-h:hover{background:color-mix(in srgb,var(--sg-sol) 9%,transparent) !important}
  :root:not([data-sec="pastel"]) #tabs .stg.on .stg-h{background:var(--sg-sol) !important}
  :root:not([data-sec="pastel"]) #tabs .stg.on .stg-h .stg-n{color:var(--sg-sol-ink) !important}
  :root:not([data-sec="pastel"]) #tabs .stg.on .stg-h::after{display:none !important}
  :root:not([data-sec="pastel"]) #tabs .stg.on .stg-h svg.lf{--d:var(--sg-sol-ink);--m:color-mix(in srgb,var(--sg-sol-ink) 78%,var(--sg-sol));--l:color-mix(in srgb,var(--sg-sol-ink) 42%,var(--sg-sol));--x:color-mix(in srgb,var(--sg-sol-ink) 42%,var(--sg-sol));--ld:var(--sg-sol-ink);--k:var(--sg-sol);filter:none !important;opacity:1 !important}
  :root[data-sec="pastel"] #tabs .stg:not(.on) .stg-h:hover{background:var(--sg-pt) !important}
  :root[data-sec="pastel"] #tabs .stg.on .stg-h{background:var(--sg-pt) !important}
  :root[data-sec="pastel"] #tabs .stg.on .stg-h::after{background:var(--sg-pt-c) !important}
}
/* en el teléfono, la raya de la etapa elegida (arriba) en su color */
@media (max-width:760px){
  .topbar #tabs .stg.on .stg-h::after{background:var(--sg-sol) !important}
  :root[data-sec="pastel"] .topbar #tabs .stg.on .stg-h::after{background:var(--sg-pt-c) !important}
}
/* la franja de pestañas, al estilo Apple: Sólidos (Vivos), el color de la etapa entero y las pestañas como texto sobre él;
   la elegida, una tarjeta blanca levantada con esquinas de 2 px. Pastel (Suaves): el velo de la etapa y la elegida igual */
.tabstrip{background:var(--sx-sol,var(--chrome));box-shadow:none;align-items:center;gap:2px;padding:7px 14px}
.tabstrip button{display:inline-flex;align-items:center;gap:7px;min-height:32px;border-radius:2px;color:color-mix(in srgb,var(--sx-sol-ink,var(--ink)) 88%,transparent);transition:background-color .15s,color .15s}
.tabstrip button:hover{background:color-mix(in srgb,var(--sx-sol-ink,var(--ink)) 14%,transparent);color:var(--sx-sol-ink,var(--ink))}
.tabstrip button[aria-current="page"]{background:var(--chrome);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08)}
.tabstrip .ts-ic{display:inline-flex}
.tabstrip .ts-ic svg.lf{width:20px;height:20px}
:root:not([data-sec="pastel"]) .tabstrip button:not([aria-current]) .ts-ic svg.lf{--d:var(--sx-sol-ink);--m:color-mix(in srgb,var(--sx-sol-ink) 80%,var(--sx-sol));--l:color-mix(in srgb,var(--sx-sol-ink) 45%,var(--sx-sol));--x:color-mix(in srgb,var(--sx-sol-ink) 45%,var(--sx-sol));--ld:var(--sx-sol-ink);--k:var(--sx-sol)}
.tabstrip button[aria-current] .ts-ic svg.lf{--k:var(--chrome)}
:root[data-sec="pastel"] .tabstrip{background:var(--sx-pt);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--sx-pt-c) 30%,transparent)}
:root[data-sec="pastel"] .tabstrip button{color:var(--muted)}
:root[data-sec="pastel"] .tabstrip button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
:root[data-sec="pastel"] .tabstrip button[aria-current="page"]{color:var(--ink)}
:root[data-sec="pastel"] .tabstrip button .ts-ic svg.lf{--k:var(--sx-pt)}
:root[data-sec="pastel"] .tabstrip button[aria-current] .ts-ic svg.lf{--k:var(--chrome)}
/* lo que se elige en las barras (el botón de un grupo, el «⋯» pegado al borde, los chips del calendario, la fila
   abierta de una lista…) toma el color de la pestaña abierta: antes salía de un gris neutro (--tab-*, de leyenda.js).
   Se define en body: también lo heredan los menús, que cuelgan de body */
body{--tab:var(--sx-tab,#8A8A8A);--tab-tint:var(--sx-pt-bar,#F2F2F2);--tab-sel:var(--sx-pt-mid,#E3E3E3);--tab-sel-ink:var(--ink);--tab-deep:var(--sx-pt-deep,#333333);--tab-bar:var(--chrome)}
:root[data-sec="pastel"] body{--tab:var(--sx-pt-c,#8A8A8A)}
/* la barra de herramientas de la pestaña. Sólidos (Vivos): clara y sin raya de color debajo, solo el filete gris de
   todas las barras (el color ya va entero en la franja de pestañas). Pastel: entera en el subtono de la pestaña, el
   mismo de la pestaña elegida en la franja (las dos quedan como una sola ficha); el botón elegido, claro y subrayado en
   su color. Con «Barras: Blancas», en Pastel la barra queda blanca y solo la línea lleva el color */
#view .bar:not(:is(.side,.insp) .bar){box-shadow:none}
:root[data-sec="pastel"][data-bars="blanca"] #view .bar:not(:is(.side,.insp) .bar){box-shadow:inset 0 -3px 0 var(--sx-pt-c,var(--line-2))}
:root[data-sec="pastel"]:not([data-bars="blanca"]) body{--tab-bar:var(--sx-pt-mid,var(--chrome))}
:root[data-sec="pastel"]:not([data-bars="blanca"]) #view .bar:not(:is(.side,.insp) .bar){background:var(--sx-pt-mid,var(--chrome));box-shadow:none;--fill:color-mix(in srgb,var(--surface) 55%,transparent);--fill-2:color-mix(in srgb,var(--surface) 75%,transparent)}
:root[data-sec="pastel"]:not([data-bars="blanca"]) #view .bar:not(:is(.side,.insp) .bar) :is(.seg button,.btn)[aria-pressed="true"]{background:var(--surface) !important;box-shadow:inset 0 -2px 0 var(--sx-pt-c,var(--ink)) !important}
/* la tarjeta de cada etapa: la pestaña abierta con el color de la suya */
#tabs .stg-m .stg-mt{color:color-mix(in oklab,var(--sg-sol) 62%,var(--ink))}
#tabs .stg-m .tab:hover{background:color-mix(in srgb,var(--ti-sol) 9%,var(--surface))}
#tabs .stg-m .tab[aria-selected="true"]{background:color-mix(in srgb,var(--ti-sol) 13%,var(--surface));box-shadow:inset 3px 0 0 var(--ti-sol)}
:root[data-sec="pastel"] #tabs .stg-m .stg-mt{color:color-mix(in oklab,var(--sg-pt-c) 70%,var(--ink))}
:root[data-sec="pastel"] #tabs .stg-m .tab:hover{background:color-mix(in srgb,var(--ti-pt) 55%,var(--surface))}
:root[data-sec="pastel"] #tabs .stg-m .tab[aria-selected="true"]{background:var(--ti-pt);box-shadow:inset 3px 0 0 var(--ti-pt-c)}

/* el panel de una ventana recibe el foco al abrirse (para el lector de pantalla): sin el contorno rojo, que parecía un error */
.dlg:focus,.dlg:focus-visible{outline:none}
/* un título de la vista para lectores de pantalla (proyecto · pestaña) */
body.home #viewH1{display:none}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* en el teléfono, las pestañas de la etapa en un botón al inicio de la barra y su menú */
.bar-pick{flex:none;font-weight:700;gap:4px;max-width:46vw}
.bar-pick .ic-chev{width:14px;height:14px}
.bar-pm button{display:flex;align-items:center;gap:10px}
.bar-pm .qk-ico svg.lf{width:22px;height:22px}
.bar-pm button[aria-current="page"]{font-weight:700;background:var(--fill)}
@media (max-width:760px){ .bar-pick{max-width:38vw;overflow:hidden;text-overflow:ellipsis;padding-inline:8px} .bar-pick>span{overflow:hidden;text-overflow:ellipsis} }
/* «Pestañas visibles», en el orden de la franja y por etapa */
.tabs-pick .tp-g{display:grid;gap:0}
.tabs-pick .tp-n{font-size:var(--fs-1);font-weight:700;color:var(--muted);margin:6px 0 0}
/* Ir a… (Ctrl + K) */
.qk-modal .dlg{width:min(560px,calc(100vw - 32px));align-self:start;margin-top:12vh}
.qk{display:grid;gap:8px}
.qk-in{font-size:var(--fs-5);padding:10px 12px}
.qk-l{display:grid;gap:1px;max-height:min(52vh,460px);overflow:auto;overscroll-behavior:contain}
.qk-it{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.qk-it.on{background:var(--fill)}
.qk-it>svg{width:18px;height:18px;flex:none;color:var(--muted);margin-inline:2px}
.qk-ico{display:inline-grid;flex:none}.qk-ico svg.lf{width:22px;height:22px}
.qk-t{display:grid;min-width:0;flex:1}
.qk-t b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk-t small{color:var(--muted);font-size:var(--fs-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk-here{color:var(--muted);font-size:var(--fs-2)}
.qk-none{margin:8px 10px;color:var(--muted)}
.qk-f{margin:0;font-size:var(--fs-2);color:var(--muted)}
kbd{display:inline-block;min-width:1.6em;padding:1px 6px;border-radius:4px;background:var(--fill);box-shadow:inset 0 -1px 0 var(--line);font:inherit;font-size:var(--fs-2);font-weight:650;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
/* los atajos de teclado */
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px 32px}
.keys h5{margin:0 0 6px;font-size:var(--fs-3)}
.keys dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:var(--fs-3);align-items:baseline}
.keys dt{white-space:nowrap}
.keys dt i{font-style:normal;color:var(--muted);margin:0 4px}
.keys dd{margin:0;color:var(--muted)}
.help>div.on{background:var(--warn-soft);border-radius:var(--r-sm)}

/* ---------- los detalles de la marca en la app (manual de marca 2026) ----------
   Los títulos en Archivo, como los textos (Recorte queda para el título de Inicio y la edición junto al logo). Los
   botones con esquinas de 6 px; «+ Nuevo» en negro (en el modo oscuro, en claro). Los grupos de opciones al estilo
   Apple, como las pestañas: un carril gris y la elegida en blanco, levantada, con esquinas de 2 px. El logotipo con
   más aire alrededor y la edición en Recorte, en rojo, al lado. La letra elegida en Apariencia › Letra sigue mandando. */
:root{--font-display:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--fw-display:700;--accent-ink:#FFFEF6;--ed-red:#CE0C1C;--seg-on:var(--surface)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--ed-red:#E8434B;--seg-on:#3B3B3B} }
:root[data-theme="dark"]{--ed-red:#E8434B;--seg-on:#3B3B3B}
.btn{border-radius:6px}
#newBtn.btn{background:#222222;border-color:#222222;color:#FFFEF6}
#newBtn.btn:hover{background:#000000;border-color:#000000;filter:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #newBtn.btn{background:#ECECEC;border-color:#ECECEC;color:#161616} }
:root[data-theme="dark"] #newBtn.btn{background:#ECECEC;border-color:#ECECEC;color:#161616}
:is(.seg,.hd-seg){border-radius:2px;padding:2px;gap:2px;background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:none}
:is(.seg,.hd-seg) button{border-radius:2px}
:is(.seg,.hd-seg) button:not([aria-pressed="true"]):hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
:is(.seg,.hd-seg,.bar .seg,.lk-body>section>.seg,.lk-opt .seg) button[aria-pressed="true"],
:root[data-sec="pastel"]:not([data-bars="blanca"]) #view .bar:not(:is(.side,.insp) .bar) .seg button[aria-pressed="true"]{background:var(--seg-on) !important;color:var(--ink) !important;box-shadow:0 1px 2px rgba(16,24,40,.16),0 0 0 .5px rgba(16,24,40,.08) !important}
/* el logotipo respira: más alto la barra y más lejos del borde; la edición en Recorte, el doble de grande y a la mitad
   de distancia (sin la letra cargada, como antes: Archivo chica en mayúsculas) */
@media (min-width:761px){
  body:not(.home) .topbar{padding-block:13px}
  body:not(.home) #brand{margin-block:-13px;padding:0 22px 0 24px}
}
.brand-w{gap:5px}
.fs-recorte .brand-ed{font:400 20px/.8 'FilmSpirit Recorte',var(--font-ui);font-synthesis:none;letter-spacing:.02em;text-transform:lowercase;color:var(--ed-red);margin-bottom:0}

/* ---------- series: episodios (series.js) ---------- */
.slist-ep li button{grid-template-columns:62px minmax(0,1fr) auto}
.slist .epi-li{margin-top:10px}
.slist .epi-li:first-child{margin-top:0}
.slist .epi-li button{grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;background:var(--panel);border-radius:var(--r-sm)}
.slist .epi-li b{font-size:var(--fs-2);font-variant-numeric:tabular-nums;color:var(--accent-text)}
.slist .epi-li span{font-weight:650;font-size:var(--fs-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist .epi-li small{color:var(--muted);font-size:var(--fs-1)}
.page .epi-pg{position:absolute;left:0;right:0;top:3em;text-align:center;font-weight:700;letter-spacing:.06em;font-size:.92em}
.ed-doc .ep.t-h[data-epi]{margin-top:3.4em}
.ed-doc .ep.t-h[data-epi]:first-child{margin-top:2.4em}
.ed-epi{position:absolute;left:0;right:0;text-align:center}
.ed-epi span{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;font-size:.86em;letter-spacing:.04em;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--page-ink)}
.epi-tbl{margin:4px 0 2px}
.epi-tbl td input{width:100%;min-width:90px}
.epi-tbl td input.w-sm{min-width:0;width:72px}
.epi-tbl small.hint{font-size:var(--fs-1)}
.epi-acts{white-space:nowrap;text-align:right}
.epi-pick{display:grid;gap:4px;margin:4px 0 10px;max-height:46vh;overflow:auto}
.pstart .pl-eps{font-weight:700}
.slist .epi-kind{display:block;color:var(--muted);font-size:var(--fs-1)}
.imp-ep{display:flex;gap:6px;margin-top:6px}
.imp-ep #iepN{width:76px}
.imp-ep #iepT{flex:1;min-width:0}
/* ============ los íconos de la marca en las etapas (Film Spirit.svg, octubre de 2026) ============
   Unidad: todos los íconos (las 5 etapas y las 14 pestañas) son piezas planas en la misma receta del logotipo:
   cuerpo amarillo, detalles en negro y en rojo.
   Independencia: cada etapa es dueña de un color de la paleta (Guion negro, Desarrollo rojo, Imagen óxido,
   Producción amarillo, Rodaje naranja), que va en su placa de la barra de la izquierda y en la franja de sus pestañas.
   La placa de la etapa elegida dibuja su ícono a una tinta, como el logotipo sobre su placa. */
:root{--fs-rojo:#CE0C1C;--fs-naranja:#F49B1E;--fs-amarillo:#FFBE0B;--fs-oxido:#AD3A00;--fs-negro:#212121;--fs-crema:#FFFEF6}
svg.lf .fy{fill:var(--fs-amarillo)} svg.lf .fr{fill:var(--fs-rojo)} svg.lf .fo{fill:var(--fs-naranja)}
svg.lf .fu{fill:var(--fs-oxido)} svg.lf .fw{fill:#FFFFFF} svg.lf .fk{fill:var(--fs-negro)}
/* de noche, lo negro que queda sobre el fondo (el broche, la franja de la claqueta) se aclara para que se vea */
:root[data-tone="dark"] svg.lf .fk.ex{fill:#5A5650}
/* las pestañas, con la misma receta: cuerpo amarillo, detalles en negro, la hoja de atrás en rojo. De noche los
   detalles que quedan sobre el fondo pasan a rojo (el negro no se vería) */
:is(.icg0,.icg1,.icg2,.icg3,.icg4){--d:var(--fs-negro);--m:var(--fs-amarillo);--l:var(--fs-rojo);--x:var(--fs-rojo);--ld:var(--fs-negro)}
:root[data-theme="dark"] :is(.icg0,.icg1,.icg2,.icg3,.icg4){--d:var(--fs-rojo);--m:var(--fs-amarillo);--l:var(--fs-rojo);--x:var(--fs-rojo);--ld:var(--fs-amarillo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :is(.icg0,.icg1,.icg2,.icg3,.icg4){--d:var(--fs-rojo);--m:var(--fs-amarillo);--l:var(--fs-rojo);--x:var(--fs-rojo);--ld:var(--fs-amarillo)}}

/* ---------- el color de cada etapa y el subtono de cada pestaña ---------- */
:root #tabs .stg[data-g="2"]{--sg-sol:#AD3A00;--sg-sol-ink:#FFFEF6;--sg-pt:#FBEFE9;--sg-pt-c:#AD3A00}
:root #tabs .stg[data-g="4"]{--sg-sol:#F49B1E;--sg-sol-ink:#212121;--sg-pt:#FEF4E6;--sg-pt-c:#A9620A}
:root[data-tab="board"]{--sx-sol:#AD3A00;--sx-sol-ink:#FFFEF6;--sx-tab:#AD3A00;--sx-tab-ink:#FFFEF6;--sx-pt:#FBEFE9;--sx-pt-deep:#7A2900;--sx-pt-mid:#F3D6C7;--sx-pt-c:#AD3A00;--sx-pt-bar:#FCF2ED}
:root[data-tab="animatic"]{--sx-sol:#AD3A00;--sx-sol-ink:#FFFEF6;--sx-tab:#8A2E00;--sx-tab-ink:#FFFEF6;--sx-pt:#FBEFE9;--sx-pt-deep:#7A2900;--sx-pt-mid:#EED0C2;--sx-pt-c:#8A2E00;--sx-pt-bar:#FAEFEA}
:root :is([data-tabgo="board"],.stg-m .tab[data-tab="board"]){--ti-sol:#AD3A00;--ti-sol-ink:#FFFEF6;--ti-pt:#F3D6C7;--ti-pt-c:#AD3A00}
:root :is([data-tabgo="animatic"],.stg-m .tab[data-tab="animatic"]){--ti-sol:#8A2E00;--ti-sol-ink:#FFFEF6;--ti-pt:#EED0C2;--ti-pt-c:#8A2E00}
:root[data-tab="gastos"]{--sx-sol:#FFBE0B;--sx-sol-ink:#212121;--sx-tab:#EBA900;--sx-tab-ink:#212121;--sx-pt:#FFF9E9;--sx-pt-deep:#5B430A;--sx-pt-mid:#FBE9BE;--sx-pt-c:#866300;--sx-pt-bar:#FEF8EA}
:root :is([data-tabgo="gastos"],.stg-m .tab[data-tab="gastos"]){--ti-sol:#EBA900;--ti-sol-ink:#212121;--ti-pt:#FBE9BE;--ti-pt-c:#866300}
:root[data-tab="call"]{--sx-sol:#F49B1E;--sx-sol-ink:#212121;--sx-tab:#F49B1E;--sx-tab-ink:#212121;--sx-pt:#FEF4E6;--sx-pt-deep:#7A4708;--sx-pt-mid:#FCE1BC;--sx-pt-c:#A9620A;--sx-pt-bar:#FEF6EB}
:root[data-tab="sup"]{--sx-sol:#F49B1E;--sx-sol-ink:#212121;--sx-tab:#D9800B;--sx-tab-ink:#212121;--sx-pt:#FEF4E6;--sx-pt-deep:#7A4708;--sx-pt-mid:#F6D9B4;--sx-pt-c:#93550A;--sx-pt-bar:#FDF4E9}
:root :is([data-tabgo="call"],.stg-m .tab[data-tab="call"]){--ti-sol:#F49B1E;--ti-sol-ink:#212121;--ti-pt:#FCE1BC;--ti-pt-c:#A9620A}
:root :is([data-tabgo="sup"],.stg-m .tab[data-tab="sup"]){--ti-sol:#D9800B;--ti-sol-ink:#212121;--ti-pt:#F6D9B4;--ti-pt-c:#93550A}

/* ---------- la barra de las etapas ---------- */
/* en reposo, cada ícono en sus colores (sin el gris de antes); al elegirla, la placa de su color y el ícono a una tinta */
#tabs .stg:not(.on) .stg-h svg.lf{filter:none !important;opacity:1}
@media (min-width:761px){
  #tabs .stg.on .stg-h svg.lf .mi{fill:var(--sg-sol-ink)}
  #tabs .stg.on .stg-h svg.lf .mk{fill:var(--sg-sol)}
  #tabs .stg.on .stg-h svg.lf .sep{stroke:var(--sg-sol);stroke-width:7;paint-order:stroke}
  #tabs .stg-h,#tabs .stg-h:hover,#tabs .stg.open .stg-h{border-radius:4px}
  #tabs .stg-h svg.lf{width:34px;height:34px}
  #tabs .stg:not(.on) .stg-h:hover{background:var(--fill) !important}
  #tabs .stg-h .stg-n{font-weight:600}
}
/* en el teléfono no hay placa: el ícono elegido en sus colores, los otros callados, y la raya de su color debajo */
@media (max-width:760px){
  .topbar #tabs .stg:not(.on) .stg-h svg.lf{opacity:.5;filter:saturate(.6) !important}
}

/* ---------- el modo oscuro: luz de sala ----------
   De noche el color no se pinta en grandes paños: queda en la placa pequeña de la etapa (como el boceto de la barra
   oscura de Film Spirit.svg) y en una línea fina. La franja de pestañas pasa a ser oscura con un velo de su etapa, y la
   pestaña abierta se marca con la raya de su color. El Guion, que de día es negro, de noche es crema. */
:root{--sgd-0:#FFFEF6;--sgd-1:#F0444F;--sgd-2:#E46A2E;--sgd-3:#FFBE0B;--sgd-4:#F49B1E}
:root[data-tone="dark"] #tabs .stg[data-g="0"]{--sg-sol:#FFFEF6;--sg-sol-ink:#212121}
:root[data-tone="dark"] #tabs .stg[data-g="2"]{--sg-sol:#AD3A00;--sg-sol-ink:#FFFEF6}
:root[data-tone="dark"] #tabs .stg[data-g="4"]{--sg-sol:#F49B1E;--sg-sol-ink:#212121}
:root[data-tone="dark"] #tabs .stg:not(.on) .stg-h svg.lf{opacity:.88 !important}
:root[data-tone="dark"] #tabs .stg:not(.on) .stg-h:hover svg.lf{opacity:1 !important}
:root[data-tone="dark"] #tabs .stg.on .stg-h .stg-n{color:var(--sg-sol-ink) !important}
:root[data-tone="dark"][data-tab]{--sx-line:var(--sgd-3)}
:root[data-tone="dark"]:is([data-tab="build"],[data-tab="script"]){--sx-line:var(--sgd-0)}
:root[data-tone="dark"]:is([data-tab="lined"],[data-tab="breakdown"],[data-tab="scout"],[data-tab="casting"]){--sx-line:var(--sgd-1)}
:root[data-tone="dark"]:is([data-tab="board"],[data-tab="animatic"]){--sx-line:var(--sgd-2)}
:root[data-tone="dark"]:is([data-tab="call"],[data-tab="sup"]){--sx-line:var(--sgd-4)}
:root[data-tone="dark"][data-tab="project"]{--sx-line:#A8A8A8}
:root[data-tone="dark"] .tabstrip{background:color-mix(in oklab,var(--sx-line) 7%,var(--chrome));box-shadow:inset 0 -1px 0 color-mix(in oklab,var(--sx-line) 30%,var(--chrome))}
:root[data-tone="dark"] .tabstrip button{color:var(--muted)}
:root[data-tone="dark"] .tabstrip button:hover{background:color-mix(in oklab,var(--ink) 7%,transparent);color:var(--ink)}
:root[data-tone="dark"] .tabstrip button[aria-current="page"]{background:color-mix(in oklab,var(--sx-line) 16%,var(--chrome));color:var(--ink);box-shadow:inset 0 -2px 0 var(--sx-line)}
:root[data-tone="dark"] .tabstrip button .ts-ic svg.lf,:root[data-tone="dark"]:not([data-sec="pastel"]) .tabstrip button:not([aria-current]) .ts-ic svg.lf{--d:var(--fs-rojo);--m:var(--fs-amarillo);--l:var(--fs-rojo);--x:var(--fs-rojo);--k:var(--chrome)}
:root[data-tone="dark"] body{--tab:var(--sx-line,#8A8A8A);--tab-deep:var(--sx-line,#C8C8C8)}

/* monocromo y Grafito: los íconos de la marca en grises */
:root[data-mono] svg.lf :is(.fy,.fo){fill:#8A8A8A} :root[data-mono] svg.lf :is(.fr,.fu,.fk){fill:#3A3A3A}

/* ---------- lote S (25-oct-2026): stripboard con tiempos, hoja de llamado con horas libres, submenú sin opacar ---------- */
/* el submenú de cada etapa: sus pestañas siempre a todo color (antes, las de una etapa que no era la actual se veían apagadas) */
#tabs .stg-m .tab,#tabs .stg:not(.on) .stg-m .tab,.pop .stg-drop button{color:var(--ink) !important;opacity:1 !important}
#tabs .stg-m .tab svg.lf,#tabs .stg:not(.on) .stg-m .tab:not(:hover) svg.lf,.pop .stg-drop:not(.on) button:not(:hover) svg.lf{filter:none !important;opacity:1 !important}
#tabs .stg-m .stg-mt{color:var(--ink);opacity:.72}
/* stripboard: la columna «Tiempo» es un campo de duración */
.prow .c-t input.dur{font-weight:650;font-variant-numeric:tabular-nums;text-align:left;padding-inline:4px}
.prow .c-t input.dur::placeholder{color:color-mix(in srgb,var(--ink) 62%,transparent);font-weight:550}
/* hoja de llamado: la nota para el equipo con su título al centro; las horas del cronograma se escriben en la tabla */
.cl-note h3{text-align:center}
.cl-t input.tm{width:100%;max-width:64px;font:inherit;font-weight:700;color:inherit;background:transparent;border:1px solid transparent;border-radius:var(--r-xs);padding:2px 4px;font-variant-numeric:tabular-nums}
.cl-t input.tm:not(:disabled):hover{background:color-mix(in srgb,var(--fill) 85%,transparent)}
.cl-t input.tm:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.cl-t input.tm::placeholder{color:inherit;opacity:.92}
.cl-cr input.tm{width:60px;font:inherit;background:transparent;border:1px solid transparent;border-radius:var(--r-xs);padding:1px 4px;color:inherit}
.cl-cr input.tm::placeholder{color:inherit}
.cl-endt input.tm{width:64px;margin-left:10px;font:inherit;font-weight:800;background:transparent;border:1px solid color-mix(in srgb,currentColor 30%,transparent);border-radius:var(--r-xs);padding:1px 6px;color:inherit;text-align:center}
.cl-endt input.tm::placeholder{color:inherit;opacity:.9}
/* espacios de las celdas: columnas más parejas en las tablas que quedaban apretadas o con huecos */
.cl-sched .cl-tbl th:nth-child(1){width:92px}.cl-sched .cl-tbl th:nth-child(2){width:26%}.cl-sched .cl-tbl th:nth-child(4){width:12%}
.cl-tbl td{padding:8px 10px}.cl-tbl th{padding:7px 10px}
.cl-ctbl td,.cl-ctbl th{padding-inline:8px}
table.dood{--dd-w:clamp(40px,calc((100cqw - var(--dd-nw) - var(--dd-tt)) / var(--dd-n,1)),128px)}
details.sec .tbl th:nth-child(2){width:64px}details.sec .tbl th:nth-child(3){width:118px}details.sec .tbl th:nth-child(4){width:96px}details.sec .tbl th:nth-child(5){width:112px}details.sec .tbl th:nth-child(6){width:120px}
details.sec .tbl td,details.sec .tbl th{padding-inline:10px}
.prow>*{padding:7px 10px}
/* miniatura del storyboard: en el stripboard (primer plano de la escena) y en cada plano del cronograma de la hoja */
.prow .c-hd.th{position:relative;padding-left:96px;min-height:58px}
.pl-th{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:var(--fill);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent)}
.cl-tbl td.cl-d.th{position:relative;padding-left:96px;min-height:46px}
.cl-th{position:absolute;left:10px;top:7px;width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:var(--fill);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent)}
.cl-tbl tr.cl-sh td{height:58px}
.pl-th.wait,.cl-th.wait{opacity:.5}
details.sec .tbl td.num,details.sec .tbl th.num{text-align:right}
details.sec .tbl td.num input{display:block;margin-left:auto}
.cl .cl-note textarea{text-align:center}
</style>
